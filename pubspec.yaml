name: zikirmatik_app
description: A modern and user-friendly zikirmatik application.
author: Caner Erdem
publish_to: 'none'
version: 1.2.5+18

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  fl_chart: ^0.66.2
  vibration: ^3.1.6
  shared_preferences: ^2.2.2
  audioplayers: ^5.2.1
  google_mobile_ads: ^5.1.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.2.6
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  flutter_timezone: ^3.0.1
  home_widget: ^0.6.0
  path_provider: ^2.1.4
  share_plus: ^10.1.2
  file_picker: ^8.1.6
  flutter_tts: ^3.8.3
  google_fonts: ^6.2.0
  supabase_flutter: ^2.3.4
  image_picker: ^1.0.4
  image: ^4.7.2
  permission_handler: ^11.3.1
  app_settings: ^5.1.1
  confetti: ^0.8.0
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  fonts:
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans-Variable.ttf

  assets:
    - assets/sounds/click.mp3
    - assets/icons/white_misbah.png
    - assets/backgrounds/
    - assets/generated/backgrounds/
    - assets/generated/illustrations/
    - assets/generated/trophies/
    - assets/fonts/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon_new.png"
  adaptive_icon_background: "#0B3A8C"
  adaptive_icon_foreground: "assets/icons/app_icon_new.png"
